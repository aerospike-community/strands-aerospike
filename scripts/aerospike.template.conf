# Aerospike database configuration file
# This template sets up a single-node, single namespace developer environment.
#
# Based on the image's own default /etc/aerospike/aerospike.template.conf, with the
# `test` namespace's storage stanza parameterized on AEROSPIKE_DEVICE: when set, the
# namespace uses `storage-engine device` against that raw block device instead of the
# image default of a file inside the container's writable layer. See
# scripts/start_aerospike_ce.sh for how AEROSPIKE_DEVICE is validated and passed in.
#
# Alternatively, you can pass in your own configuration file.
# You can see more examples at
# https://github.com/aerospike/aerospike-server/tree/master/as/etc

# This stanza must come first.
service {
	$([ -n "${FEATURE_KEY_FILE}" ] && echo "feature-key-file ${FEATURE_KEY_FILE}")
	cluster-name docker
}

logging {
	$([ -n "${LOGFILE}" ] && echo "# Log file must be an absolute path.")
	$([ -n "${LOGFILE}" ] && echo "file ${LOGFILE} {")
	$([ -n "${LOGFILE}" ] && echo "    context any info")
	$([ -n "${LOGFILE}" ] && echo "}")

	# Send log messages to stdout
	console {
		context any info
	}
}

network {
	service {
		address ${SERVICE_ADDRESS}
		port ${SERVICE_PORT}

		# Uncomment the following to set the 'access-address' parameter to the
		# IP address of the Docker host. This will the allow the server to correctly
		# publish the address which applications and other nodes in the cluster to
		# use when addressing this node.
		# access-address <IPADDR>
	}

	heartbeat {
		# mesh is used for environments that do not support multicast
		mode mesh
		address local
		port 3002
		interval 150
		timeout 10
	}

	fabric {
		# Intra-cluster communication port (migrates, replication, etc)
		# default to same address in 'service'
		address local
		port 3001
	}

}

namespace ${NAMESPACE} {
	replication-factor 1
	$( [[ "${DEFAULT_TTL}" != "0" ]] && echo "default-ttl ${DEFAULT_TTL}")
	$( [[ "${NSUP_PERIOD}" != "0" ]] && echo "nsup-period ${NSUP_PERIOD}")

	storage-engine $([ "${DATA_IN_MEMORY}" = "true" ] && echo "memory" || echo "device") {
		# Raw block device (AEROSPIKE_DEVICE set) skips filesystem overhead and avoids
		# double-buffering through the host's page cache -- closer to a production
		# deployment than the file-backed default. Falls back to a file inside the
		# container when no device is configured, which is fine for correctness testing.
		$([ -n "${AEROSPIKE_DEVICE:-}" ] && echo "device ${AEROSPIKE_DEVICE}" || echo "file /opt/aerospike/data/${NAMESPACE}.dat")
		$([ -z "${AEROSPIKE_DEVICE:-}" ] && echo "filesize ${STORAGE_GB}G")
		$(([ -z "${DATA_IN_MEMORY}" ] || [ "${DATA_IN_MEMORY}" = "false" ]) && echo "read-page-cache ${READ_PAGE_CACHE}")
	}
}
